# Evidence-backed feature catalog.
#
# Each entry MUST include:
#   id:                       integer feature ID in the Goodfire SAE
#   label:                    human-readable concept name
#   category:                 one of {behavioral, epistemic, task, risk}
#   top_activation_examples:  3+ prompts where this feature fires strongly
#   contrast_score:           activation on positive prompt vs neutral baseline
#   causal_effect:            measured behavioral delta when steering +/-
#   recommended_delta:        suggested amplify/suppress magnitude
#   confidence:               one of {low, medium, high} — based on contrast clarity
#   notes:                    anything else worth recording
#
# Day 3 work: discover via contrast prompts on Modal, fill this file in.
# Day 4 work: verify causal_effect by running steered generations.
#
# Until Day 3, this file is a SCHEMA, not data. Do not trust the IDs below
# until they're verified against the actual Goodfire checkpoint.

